name: S.G. Wedding Hub Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project ZIP
        shell: bash
        run: |
          ZIP="SG_Wedding_Hub_Firebase_Android_Studio.zip"
          test -f "$ZIP" || { echo "ZIP not found"; exit 1; }
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          SETTINGS=$(find extracted -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            | head -n 1)

          test -n "$SETTINGS" || { echo "Gradle settings not found"; exit 1; }

          ROOT=$(dirname "$SETTINGS")
          echo "BUILD_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Fix Java and Kotlin targets
        shell: bash
        run: |
          python3 - "$BUILD_ROOT/app/build.gradle.kts" <<'PY'
          import re
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          # Remove the invalid block added by the previous workflow.
          s = re.sub(
              r'\ntasks\.withType\(org\.jetbrains\.kotlin\.gradle\.tasks\.KotlinCompile\)'
              r'\.configureEach\s*\{.*?^\s*\}\s*(?=\s*$)',
              '\n',
              s,
              flags=re.S | re.M
          )

          # Replace Java 8 targets with Java 17.
          s = re.sub(r'JavaVersion\.VERSION_1_8',
                     'JavaVersion.VERSION_17', s)
          s = re.sub(r'JavaVersion\.VERSION_1_8',
                     'JavaVersion.VERSION_17', s)
          s = re.sub(r'jvmTarget\s*=\s*["\']1\.8["\']',
                     'jvmTarget = "17"', s)

          # Ensure Java compile options are inside android { }.
          if 'compileOptions {' not in s:
              s = re.sub(
                  r'android\s*\{',
                  lambda m: m.group(0) +
                  '\n    compileOptions {\n'
                  '        sourceCompatibility = JavaVersion.VERSION_17\n'
                  '        targetCompatibility = JavaVersion.VERSION_17\n'
                  '    }\n',
                  s,
                  count=1
              )

          # Ensure Kotlin JVM target is configured inside android { }.
          if 'kotlinOptions {' not in s:
              match = re.search(r'android\s*\{', s)
              if not match:
                  raise SystemExit('android { } block not found')
              start = match.end()
              depth = 1
              i = start
              while i < len(s) and depth:
                  if s[i] == '{':
                      depth += 1
                  elif s[i] == '}':
                      depth -= 1
                  i += 1
              if depth:
                  raise SystemExit('Unclosed android { } block')
              s = s[:i-1] + '\n    kotlinOptions {\n' \
                  '        jvmTarget = "17"\n' \
                  '    }\n' + s[i-1:]

          p.write_text(s)
          print('Updated:', p)
          print('Reviewing target settings:')
          for line in s.splitlines():
              if any(k in line for k in (
                  'sourceCompatibility', 'targetCompatibility',
                  'jvmTarget', 'tasks.withType'
              )):
                  print(line.strip())
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: gradle -p "$BUILD_ROOT" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SG-Wedding-Hub-debug-APK
          path: ${{ env.BUILD_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
