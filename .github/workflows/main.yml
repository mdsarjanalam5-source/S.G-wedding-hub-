name: S.G. Wedding Hub Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project ZIP
        shell: bash
        run: |
          ZIP="SG_Wedding_Hub_Firebase_Android_Studio.zip"

          if [ ! -f "$ZIP" ]; then
            echo "Missing $ZIP in repository root"
            ls -la
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          SETTINGS=$(find extracted -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "Gradle settings file not found"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")

          if [ ! -f "$ROOT/app/build.gradle.kts" ] && \
             [ ! -f "$ROOT/app/build.gradle" ]; then
            echo "App Gradle file not found"
            find "$ROOT" -maxdepth 4 -type f
            exit 1
          fi

          echo "BUILD_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Fix Java and Kotlin JVM targets
        shell: bash
        run: |
          FILE="$BUILD_ROOT/app/build.gradle.kts"

          if [ -f "$FILE" ]; then
            python3 - "$FILE" <<'PY'
          import re, sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          if re.search(r'compileOptions\s*\{', s):
              s = re.sub(
                  r'(sourceCompatibility\s*=\s*)JavaVersion\.VERSION_1_8',
                  r'\1JavaVersion.VERSION_17', s)
              s = re.sub(
                  r'(targetCompatibility\s*=\s*)JavaVersion\.VERSION_1_8',
                  r'\1JavaVersion.VERSION_17', s)
              s = re.sub(
                  r'(sourceCompatibility\s*=\s*)JavaVersion\.toVersion\(["\']1\.8["\']\)',
                  r'\1JavaVersion.VERSION_17', s)
              s = re.sub(
                  r'(targetCompatibility\s*=\s*)JavaVersion\.toVersion\(["\']1\.8["\']\)',
                  r'\1JavaVersion.VERSION_17', s)
          else:
              block = '''
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              '''
              s = re.sub(r'android\s*\{', lambda m: m.group(0) + block, s, count=1)

          s = re.sub(r'jvmTarget\s*=\s*["\']1\.8["\']',
                     'jvmTarget = "17"', s)

          if 'kotlinOptions {' in s:
              if 'jvmTarget' not in s:
                  s = s.replace('kotlinOptions {',
                                'kotlinOptions {\n        jvmTarget = "17"', 1)
          elif 'compilerOptions {' not in s and 'org.jetbrains.kotlin' in s:
              s += '''

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          '''

          p.write_text(s)
          print("Updated JVM target settings in", p)
          PY
          else
            FILE="$BUILD_ROOT/app/build.gradle"
            echo "Groovy Gradle file detected: $FILE"
            grep -nE 'sourceCompatibility|targetCompatibility|jvmTarget|kotlinOptions' "$FILE" || true
            echo "Please check Groovy Gradle target settings."
            exit 1
          fi

      - name: Build Debug APK
        run: gradle -p "$BUILD_ROOT" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SG-Wedding-Hub-debug-APK
          path: ${{ env.BUILD_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
