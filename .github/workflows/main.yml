name: S.G. Wedding Hub Android Build
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract Android project ZIP
        shell: bash
        run: |
          ZIP="SG_Wedding_Hub_Firebase_Android_Studio.zip"
          if [ ! -f "$ZIP" ]; then echo "Missing $ZIP in repository root"; ls -la; exit 1; fi
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted
          SETTINGS=$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
          if [ -z "$SETTINGS" ]; then echo 'Gradle settings file not found'; find extracted -maxdepth 5 -type f | head -100; exit 1; fi
          ROOT=$(dirname "$SETTINGS")
          echo "Gradle root: $ROOT"
          if [ ! -f "$ROOT/app/build.gradle.kts" ] && [ ! -f "$ROOT/app/build.gradle" ]; then echo 'app Gradle file not found'; find "$ROOT" -maxdepth 4 -type f | head -100; exit 1; fi
          echo "BUILD_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Debug APK
        run: gradle -p "$BUILD_ROOT" assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SG-Wedding-Hub-debug-APK
          path: ${{ env.BUILD_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
